[build]
  command = "npm install"
  functions = "functions"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

[functions]
  included_files = ["views/**", "labs/**", "data/**", "public/**"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
  force = true
